name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the development
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: "RequestProject"

      - name: Axiom audit (semantic — parses #print axioms, not source text)
        run: |
          set -o pipefail
          lake env lean RequestProject/TwoMinds/AxiomCheck.lean | tee axiom-audit.txt
          # Extract the bracketed axiom list from each line and reject anything
          # outside the standard footprint.  Source text is never grepped:
          # doc comments and declaration names false-positive on "sorry".
          BAD=$(sed -n 's/.*depends on axioms: \[\(.*\)\]/\1/p' axiom-audit.txt \
                | tr ',' '\n' | tr -d ' []' | sort -u \
                | grep -vE '^(propext|Classical\.choice|Quot\.sound)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::non-standard axioms found:"; echo "$BAD"; exit 1
          fi
          COUNT=$(grep -c 'depends on axioms' axiom-audit.txt)
          if [ "$COUNT" -lt 14 ]; then
            echo "::error::expected 14 audited results, saw $COUNT"; exit 1
          fi
          echo "clean: $COUNT results, standard footprint only"

      - name: Upload axiom audit
        uses: actions/upload-artifact@v4
        with:
          name: axiom-audit
          path: axiom-audit.txt
