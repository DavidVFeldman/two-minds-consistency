name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the development
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: "RequestProject"

      - name: No `sorry` in the development
        run: |
          if grep -rn --include='*.lean' '\bsorry\b' RequestProject/; then
            echo "::error::found sorry in RequestProject/"
            exit 1
          fi
          echo "clean: no sorry"

      - name: No added axioms in the development
        run: |
          if grep -rnE --include='*.lean' '^[[:space:]]*axiom[[:space:]]' RequestProject/; then
            echo "::error::found an axiom declaration in RequestProject/"
            exit 1
          fi
          echo "clean: no axiom declarations"

      - name: Axiom audit
        run: |
          cat > audit.lean <<'LEAN'
          import RequestProject.TwoMinds.Necessitation
          import RequestProject.TwoMinds.StageFormulaProp64
          #print axioms TwoMinds.main
          #print axioms TwoMinds.two_minds
          #print axioms TwoMinds.no_watched_provable
          #print axioms TwoMinds.patternTheory_consistent
          #print axioms TwoMinds.reformulation
          #print axioms TwoMinds.never_fires
          #print axioms TwoMinds.necessitation
          #print axioms TwoMinds.provBefore_nat_iff
          #print axioms TwoMinds.conBefore_iff_consistent_or_haltR
          #print axioms TwoMinds.haltR_rhoStage_iff
          LEAN
          lake env lean audit.lean | tee axiom-audit.txt

      - name: Upload axiom audit
        uses: actions/upload-artifact@v4
        with:
          name: axiom-audit
          path: axiom-audit.txt
